[build]
  publish = "site"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Send the old Netlify address to the real domain.
[[redirects]]
  from = "https://aetherize.netlify.app/*"
  to = "https://myaether.info/:splat"
  status = 301
  force = true
