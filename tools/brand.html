<!doctype html>
<html><head><meta charset="utf-8">

<body>
<script>

const BRAND_DARK = [[184,164,255],[158,230,212],[255,184,154],[247,200,232]];
const BRAND_LIGHT = [[106,82,209],[42,150,132],[214,108,72],[190,84,150]];
let BRAND = BRAND_DARK;
function brand(t) {
  t = ((t % 1) + 1) % 1 * 4; const i = Math.floor(t), f = t - i, a = BRAND[i], b = BRAND[(i + 1) % 4];
  const s = f * f * (3 - 2 * f);
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * s)).join(",")})`;
}
function ring(g, cx, cy, rx, ry, rot, w, alpha, off) {
  const N = 240;
  g.save(); g.translate(cx, cy); g.rotate(rot); g.lineWidth = w; g.lineCap = "round"; g.globalAlpha = alpha;
  for (let i = 0; i < N; i++) {
    const a0 = i / N * Math.PI * 2, a1 = (i + 1.4) / N * Math.PI * 2;
    g.strokeStyle = brand(i / N + off); g.beginPath();
    g.ellipse(0, 0, rx, ry, 0, a0, a1); g.stroke();
  }
  g.restore();
}
function glow(g, x, y, r, col = "255,255,255", a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.25, `rgba(${col},${a * 0.7})`); gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}
function sphere(g, cx, cy, R, detail = true) {
  const halo = g.createRadialGradient(cx, cy, 0, cx, cy, R * 1.35);
  halo.addColorStop(0, "rgba(184,164,255,.35)"); halo.addColorStop(1, "rgba(184,164,255,0)");
  g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, R * 1.35, 0, 7); g.fill();
  ring(g, cx, cy, R * 0.98, R * 0.98, 0, R * 0.018, 0.45, 0.55);              // meridian circle
  ring(g, cx, cy, R * 0.34, R * 0.98, 0, R * 0.016, 0.5, 0.85);               // meridian seen edge-on
  ring(g, cx, cy, R, R * 0.36, 0.42, R * 0.022, 0.6, 0.3);                    // equator
  ring(g, cx, cy, R, R * 0.36, -0.2, R * 0.05, 1, 0);                         // ecliptic, the hero ring
  if (detail) {
    const planets = [[0.4, 0.09, "255,217,168"], [2.3, 0.07, "255,194,214"], [3.6, 0.06, "158,230,212"], [5.2, 0.075, "247,242,251"]];
    for (const [a, s, c] of planets) {
      const x = Math.cos(a) * R, y = Math.sin(a) * R * 0.36;
      const px = cx + x * Math.cos(-0.2) - y * Math.sin(-0.2), py = cy + x * Math.sin(-0.2) + y * Math.cos(-0.2);
      glow(g, px, py, R * s * 2.2, c, 1);
    }
  }
  glow(g, cx, cy, R * 0.32, "247,242,251", 1);
}
function background(g, w, h) {
  const bg = g.createRadialGradient(w * 0.5, h * 0.42, 0, w * 0.5, h * 0.5, Math.max(w, h) * 0.75);
  bg.addColorStop(0, "#35225e"); bg.addColorStop(0.55, "#1C1230"); bg.addColorStop(1, "#0f0820");
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
}
function stars(g, w, h, n, seed = 7) {
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * 0.6 + 0.15})`; g.beginPath(); g.arc(rnd() * w, rnd() * h, rnd() * Math.max(w, h) / 900 + 0.4, 0, 7); g.fill(); }
}

const INK = "#F7F2FB", DEEP = "#1C1230";
function iris(g, x0, x1) { const gr = g.createLinearGradient(x0, 0, x1, 0); [["#B8A4FF", 0], ["#9EE6D4", .4], ["#FFB89A", .75], ["#F7C8E8", 1]].forEach(([c, s]) => gr.addColorStop(s, c)); return gr; }
function vgrad(g, w, h, stops) { const gr = g.createLinearGradient(0, 0, 0, h); stops.forEach(([c, s]) => gr.addColorStop(s, c)); g.fillStyle = gr; g.fillRect(0, 0, w, h); }
function warmGlow(g, w, h, y = 1.05, a = .42) { const r = g.createRadialGradient(w / 2, h * y, 0, w / 2, h * y, Math.max(w, h) * .8); r.addColorStop(0, `rgba(255,184,154,${a})`); r.addColorStop(1, "rgba(255,184,154,0)"); g.fillStyle = r; g.fillRect(0, 0, w, h); }
function lightSphere(g, cx, cy, R) {
  BRAND = BRAND_LIGHT;
  const halo = g.createRadialGradient(cx, cy, 0, cx, cy, R * 1.3); halo.addColorStop(0, "rgba(184,164,255,.35)"); halo.addColorStop(1, "rgba(184,164,255,0)");
  g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, R * 1.3, 0, 7); g.fill();
  ring(g, cx, cy, R * 0.98, R * 0.98, 0, R * 0.018, 0.45, 0.55);
  ring(g, cx, cy, R * 0.34, R * 0.98, 0, R * 0.016, 0.5, 0.85);
  ring(g, cx, cy, R, R * 0.36, 0.42, R * 0.022, 0.6, 0.3);
  ring(g, cx, cy, R, R * 0.36, -0.2, R * 0.05, 1, 0);
  const planets = [[0.4, 0.07, "229,140,80"], [2.3, 0.055, "214,84,140"], [3.6, 0.05, "42,150,132"], [5.2, 0.06, "106,82,209"]];
  for (const [a, s, c] of planets) { const x = Math.cos(a) * R, y = Math.sin(a) * R * 0.36; glow(g, cx + x * Math.cos(-0.2) - y * Math.sin(-0.2), cy + x * Math.sin(-0.2) + y * Math.cos(-0.2), R * s * 2.2, c, 1); }
  glow(g, cx, cy, R * 0.3, "106,82,209", .9);
  BRAND = BRAND_DARK;
}
function text(g, s, x, y, font, fill, align = "center") { g.font = font; g.fillStyle = fill; g.textAlign = align; g.fillText(s, x, y); }

const KINDS = {

  "pfp-dusk": [1080, 1080, (g, w, h) => { vgrad(g, w, h, [["#33245e", 0], ["#7a4a86", .55], ["#e09a8c", 1]]); stars(g, w, h * .6, 90, 9); sphere(g, w / 2, 430, 235); text(g, "æther", w / 2, 800, 'italic 400 168px "Fraunces"', "#FFF7F2"); }],
  "pfp-monogram": [1080, 1080, (g, w, h) => { background(g, w, h); stars(g, w, h, 120, 13); sphere(g, w / 2, h / 2, 380, false); g.globalAlpha = 1; g.font = 'italic 400 520px "Fraunces"'; g.textAlign = "center"; g.fillStyle = iris(g, 300, 780); g.shadowColor = "rgba(28,18,48,.6)"; g.shadowBlur = 40; g.fillText("æ", w / 2, h / 2 + 150); g.shadowBlur = 0; }],
  "pfp-dawn": [1080, 1080, (g, w, h) => { vgrad(g, w, h, [["#f6eefb", 0], ["#ffcfba", 1]]); lightSphere(g, w / 2, 430, 235); text(g, "æther", w / 2, 800, 'italic 400 168px "Fraunces"', DEEP); }],

  // ---------- Logos (transparent) ----------
  "logo-wordmark-light": [2000, 700, (g, w, h) => text(g, "æther", w / 2, 470, 'italic 400 440px "Fraunces"', INK)],
  "logo-wordmark-dark": [2000, 700, (g, w, h) => text(g, "æther", w / 2, 470, 'italic 400 440px "Fraunces"', DEEP)],
  "logo-wordmark-iris": [2000, 700, (g, w, h) => { g.font = 'italic 400 440px "Fraunces"'; g.textAlign = "center"; g.fillStyle = iris(g, 420, 1580); g.fillText("æther", w / 2, 470); }],
  "logo-lockup-light": [2400, 800, (g, w, h) => { sphere(g, 420, 400, 270); text(g, "æther", 820, 520, 'italic 400 380px "Fraunces"', INK, "left"); }],
  "logo-lockup-dark": [2400, 800, (g, w, h) => { lightSphere(g, 420, 400, 270); text(g, "æther", 820, 520, 'italic 400 380px "Fraunces"', DEEP, "left"); }],
  "logo-mark": [1024, 1024, (g, w, h) => sphere(g, w / 2, h / 2, 380)],
  "logo-mark-light": [1024, 1024, (g, w, h) => lightSphere(g, w / 2, h / 2, 380)],

  // ---------- Social templates ----------
  "story-cover": [1080, 1920, (g, w, h) => {
    background(g, w, h); stars(g, w, h, 320, 21); warmGlow(g, w, h, 1.02, .45); sphere(g, w / 2, 720, 400);
    text(g, "æther", w / 2, 1330, 'italic 400 190px "Fraunces"', INK);
    text(g, "What is the sky saying", w / 2, 1450, '400 64px "Fraunces"', "rgba(247,242,251,.92)");
    text(g, "about your day?", w / 2, 1530, '400 64px "Fraunces"', "rgba(247,242,251,.92)");
    const pw = 560, ph = 96, px = w / 2 - pw / 2, py = 1630; g.fillStyle = iris(g, px, px + pw); g.beginPath(); g.roundRect(px, py, pw, ph, ph / 2); g.fill();
    text(g, "Free reading · link in bio", w / 2, py + 61, '600 38px "Figtree"', DEEP);
  }],
  "story-blank": [1080, 1920, (g, w, h) => {
    background(g, w, h); stars(g, w, h, 260, 31); warmGlow(g, w, h, 1.05, .35); sphere(g, w / 2, 560, 300);
    text(g, "æther", w / 2, 1780, 'italic 400 72px "Fraunces"', "rgba(247,242,251,.85)");
  }],
  "post-quote": [1080, 1350, (g, w, h) => {
    vgrad(g, w, h, [["#33245e", 0], ["#5d3b7c", .6], ["#c9867f", 1]]); stars(g, w, h * .7, 120, 41); sphere(g, w / 2, 330, 190);
    text(g, "TO CARRY WITH YOU", w / 2, 650, '600 30px "Figtree"', "rgba(255,247,242,.7)");
    const lines = ["Heavy skies still move.", "So will this."];
    lines.forEach((l, i) => text(g, l, w / 2, 790 + i * 104, 'italic 400 92px "Fraunces"', "#FFF7F2"));
    text(g, "æther", w / 2, 1240, 'italic 400 64px "Fraunces"', "rgba(255,247,242,.85)");
  }],
  "post-daily": [1080, 1350, (g, w, h) => {
    background(g, w, h); stars(g, w, h, 200, 51); warmGlow(g, w, h, 1.05, .3);
    text(g, "TODAY'S SKY", 90, 150, '600 30px "Figtree"', "rgba(247,242,251,.65)", "left");
    sphere(g, w / 2, 470, 250);
    text(g, "If today feels heavy,", 90, 900, '400 80px "Fraunces"', INK, "left");
    text(g, "it's not just you.", 90, 995, '400 80px "Fraunces"', INK, "left");
    text(g, "Mars is squaring a lot of us this week. Go gently.", 90, 1080, '500 36px "Figtree"', "rgba(247,242,251,.75)", "left");
    text(g, "æther", w - 90, 1260, 'italic 400 60px "Fraunces"', "rgba(247,242,251,.85)", "right");
  }],
  "video-overlay": [1080, 1920, (g, w, h) => {
    text(g, "æther", w / 2, 1460, 'italic 400 190px "Fraunces"', INK);
    text(g, "What is the sky saying", w / 2, 1580, '400 62px "Fraunces"', "rgba(247,242,251,.92)");
    text(g, "about your day?", w / 2, 1658, '400 62px "Fraunces"', "rgba(247,242,251,.92)");
  }],
  "banner": [1500, 500, (g, w, h) => {
    background(g, w, h); stars(g, w, h, 160, 61); warmGlow(g, w, h, 1.3, .35); sphere(g, 1180, 250, 190);
    text(g, "æther", 140, 260, 'italic 400 150px "Fraunces"', INK, "left");
    text(g, "Your daily astrological weather. It's not just you.", 146, 340, '500 34px "Figtree"', "rgba(247,242,251,.78)", "left");
  }],
};
const q = new URLSearchParams(location.search);
Promise.all(['italic 400 104px "Fraunces"', '400 40px "Fraunces"', '500 30px "Figtree"', '600 32px "Figtree"'].map(f => document.fonts.load(f))).then(() => {
  const [w, h, fn] = KINDS[q.get("kind")];
  const c = document.createElement("canvas"); c.width = w; c.height = h; c.id = "art"; document.body.appendChild(c);
  fn(c.getContext("2d"), w, h);
  document.title = "ready";
});
window.KINDS_LIST = Object.keys(KINDS);
</script>
