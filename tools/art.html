<!doctype html>

<!-- æther icons and link-preview images, Sticker club direction. Rendered by tools/make_art.py. -->
<style>
@font-face { font-family: "Unbounded"; font-weight: 200 900; src: url("../site/fonts/unbounded-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 100 1000; src: url("../site/fonts/dm-sans-latin-wght-normal.woff2") format("woff2"); }

<script>
const INK = "#141218", PINK = "#FF6FAE", YEL = "#FFD84D", MINT = "#6EE7B7", COB = "#3D3BFF", LILAC = "#E9E2FF";

function ground(g, w, h, dots = true, col = LILAC) {
  g.fillStyle = col; g.fillRect(0, 0, w, h);
  if (!dots) return;
  const step = Math.max(14, Math.round(Math.max(w, h) / 34));
  g.fillStyle = "rgba(20,18,24,.08)";
  for (let y = step / 2; y < h; y += step) for (let x = step / 2; x < w; x += step) { g.beginPath(); g.arc(x, y, step * 0.08, 0, 7); g.fill(); }
}
// A sticker globe: cobalt ball with an ink outline and a white shine, a thick pink ring with an ink outline, outlined planet dots.
function globe(g, cx, cy, R, { detail = true, shadow = 0, edge = INK } = {}) {
  const lw = Math.max(1.5, R * 0.055);
  const rx = R * 1.62, ry = R * 0.46, rot = -0.24;
  const ring = (a0, a1) => {
    g.save(); g.translate(cx, cy); g.rotate(rot); g.lineCap = "round";
    g.strokeStyle = edge; g.lineWidth = R * 0.26; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, a0, a1); g.stroke();
    g.strokeStyle = PINK; g.lineWidth = R * 0.26 - lw * 2.2; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, a0, a1); g.stroke();
    g.restore();
  };
  const at = a => { const x = Math.cos(a) * rx, y = Math.sin(a) * ry; return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]; };
  const dot = (a, r, col) => { const [x, y] = at(a); g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = col; g.fill(); g.lineWidth = lw * 0.9; g.strokeStyle = edge; g.stroke(); };
  if (shadow) { g.fillStyle = edge; g.beginPath(); g.arc(cx + shadow, cy + shadow, R + lw / 2, 0, 7); g.fill(); }
  ring(Math.PI * 1.02, Math.PI * 1.98);
  if (detail) dot(Math.PI * 1.32, R * 0.13, MINT);
  g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fillStyle = COB; g.fill(); g.lineWidth = lw; g.strokeStyle = edge; g.stroke();
  if (R > 20) { g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = R * 0.11; g.lineCap = "round"; g.beginPath(); g.arc(cx, cy, R * 0.72, Math.PI * 1.08, Math.PI * 1.44); g.stroke(); }
  ring(-0.02, Math.PI + 0.02);
  if (detail) { dot(Math.PI * 0.22, R * 0.17, YEL); dot(Math.PI * 0.72, R * 0.12, "#fff"); }
}
function spark(g, x, y, s, col) {
  g.save(); g.translate(x, y); g.beginPath(); g.moveTo(0, -s);
  g.bezierCurveTo(s * .1, -s * .3, s * .3, -s * .1, s, 0); g.bezierCurveTo(s * .3, s * .1, s * .1, s * .3, 0, s);
  g.bezierCurveTo(-s * .1, s * .3, -s * .3, s * .1, -s, 0); g.bezierCurveTo(-s * .3, -s * .1, -s * .1, -s * .3, 0, -s);
  g.fillStyle = col; g.fill(); g.lineWidth = Math.max(2, s * 0.11); g.lineJoin = "round"; g.strokeStyle = INK; g.stroke(); g.restore();
}
function pill(g, x, y, text, font, padX, h, fill, rot = 0, shadow = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.font = font;
  const w = g.measureText(text).width + padX * 2;
  if (shadow) { g.beginPath(); g.roundRect(shadow, shadow, w, h, h / 2); g.fillStyle = INK; g.fill(); }
  g.beginPath(); g.roundRect(0, 0, w, h, h / 2); g.fillStyle = fill; g.fill(); g.lineWidth = Math.max(3, h * 0.08); g.strokeStyle = INK; g.stroke();
  g.fillStyle = INK; g.textBaseline = "middle"; g.fillText(text, padX, h / 2 + h * 0.03); g.restore();
  return w;
}

function make(kind, size) {
  const [w, h] = kind === "og" ? [1200, 630] : kind === "square" ? [1200, 1200] : [size, size];
  const c = document.createElement("canvas"); c.width = w; c.height = h; c.id = "art"; document.body.appendChild(c);
  const g = c.getContext("2d");
  if (kind === "og") {
    ground(g, w, h);
    globe(g, 300, 330, 150, { shadow: 12 });
    spark(g, 110, 110, 34, YEL); spark(g, 530, 520, 22, PINK);
    g.fillStyle = INK; g.font = '800 128px "Unbounded"'; g.fillText("æther", 600, 300);
    g.fillStyle = COB; g.font = '700 52px "Caveat"'; g.fillText("your daily astrological weather", 608, 372);
    pill(g, 606, 420, "free · no account · every day", '700 26px "DM Sans"', 26, 58, YEL, -0.03, 6);
  } else if (kind === "square") {
    ground(g, w, h);
    globe(g, w / 2, 400, 230, { shadow: 16 });
    spark(g, 170, 170, 48, YEL); spark(g, 1030, 640, 30, PINK); spark(g, 1010, 150, 22, MINT);
    g.textAlign = "center"; g.fillStyle = INK; g.font = '800 160px "Unbounded"'; g.fillText("æther", w / 2, 860);
    g.fillStyle = COB; g.font = '700 64px "Caveat"'; g.fillText("what's the sky saying about your day?", w / 2, 950);
    g.textAlign = "left"; g.font = '700 38px "Unbounded"';
    const label = "get your free reading  ›", pw = g.measureText(label).width + 88;
    pill(g, w / 2 - pw / 2, 1010, label, '700 38px "Unbounded"', 44, 96, YEL, 0, 10);
  } else {
    const small = size <= 48;
    ground(g, w, h, size >= 120);
    const R = w * (kind === "maskable" ? 0.2 : small ? 0.27 : 0.25);
    globe(g, w / 2 - w * 0.02, h / 2 + w * 0.01, R, { detail: !small, shadow: small ? 0 : R * 0.07 });
    if (size >= 120 && kind !== "maskable") { spark(g, w * 0.18, h * 0.2, w * 0.07, YEL); spark(g, w * 0.83, h * 0.8, w * 0.045, PINK); }
  }
}
const q = new URLSearchParams(location.search);
Promise.all(['800 64px "Unbounded"', '700 30px "DM Sans"', '700 40px "Caveat"'].map(f => document.fonts.load(f))).then(() => {
  make(q.get("kind"), +q.get("size") || 512);
  document.title = "ready";
});
</script>
