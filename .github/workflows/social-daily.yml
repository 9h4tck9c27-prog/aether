name: Instagram · post what's due
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes; the script posts each item once, at or after its London time
  workflow_dispatch:
concurrency: { group: social-post, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out the social data branch
        id: data
        run: |
          if git fetch origin social:refs/remotes/origin/social; then git worktree add social-data origin/social && echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.data.outputs.ok == '1'
        with: { python-version: "3.12" }
      - name: Post
        if: steps.data.outputs.ok == '1'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
        run: cd tools/social && python daily.py
      - name: Save the log
        if: always() && steps.data.outputs.ok == '1'
        run: |
          cd social-data
          git config user.name "æther bot"; git config user.email "aetherapp@users.noreply.github.com"
          [ -d log ] || exit 0
          git add -A log
          git diff --cached --quiet || (git commit -m "Post log $(date -u +%FT%RZ)" && git push origin HEAD:social)
