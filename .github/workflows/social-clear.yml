name: Instagram · clear the Buffer queue
on:
  push:
    branches: [main]
    paths: [".github/triggers/clear-now"]   # Claude updates this file to remove every queued post
  workflow_dispatch:
concurrency: { group: social-weekly, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch origin social:refs/remotes/origin/social
          git worktree add social-data origin/social
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Delete queued posts in Buffer
        env:
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: cd tools/social && python clear.py
      - name: Save the log
        if: always()
        run: |
          cd social-data
          git config user.name "æther bot"; git config user.email "aetherapp@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "Cleared Buffer queue $(date -u +%F)" && git push origin HEAD:social)
