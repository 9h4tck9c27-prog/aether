name: Instagram · check media links
on:
  push:
    branches: [main]
    paths: [".github/triggers/diagnose"]
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch origin social:refs/remotes/origin/social && git worktree add social-data origin/social
          mkdir -p social-data/log; out=social-data/log/media-check.txt; : > $out
          for u in https://myaether.info/api/social/media/2026-10-21-quote.jpg https://myaether.info/m/2026-10-21-quote.jpg https://myaether.info/api/social/media/2026-10-19-promo.mp4 https://myaether.info/m/2026-10-19-promo.mp4; do
            echo "=== HEAD $u" >> $out; curl -sS -I -A "Mozilla/5.0" "$u" >> $out 2>&1
            echo "=== GET $u" >> $out; curl -sS -A "Mozilla/5.0" -o /tmp/f -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" "$u" >> $out 2>&1; file /tmp/f >> $out; head -c 200 /tmp/f | xxd | head -3 >> $out
          done
          cd social-data && git config user.name "æther bot" && git config user.email "aetherapp@users.noreply.github.com"
          git add -A log && git commit -m "Media link check" && git push origin HEAD:social
